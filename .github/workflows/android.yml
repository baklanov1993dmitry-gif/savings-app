name: Android APK
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.5" }
      - name: Keystore
        run: keytool -genkeypair -keystore android/app/release.keystore -alias nak -keyalg RSA -keysize 2048 -validity 10000 -storepass nakopleniya2026 -keypass nakopleniya2026 -dname "CN=Nakopleniya"
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease 2>&1 | tee ../build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk nakopleniya.apk
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest nakopleniya.apk --title "Накопления (APK)" --notes "сборка ${GITHUB_RUN_NUMBER}"
      - name: Save log on failure
        if: failure()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan build-log; git rm -rf . -q || true
          tail -n 120 build.log > build-error.txt 2>/dev/null || echo "no log" > build-error.txt
          git add build-error.txt; git commit -qm "build error"; git push -f origin build-log
