<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Мои накопления</title>
<style>
:root{
  --bg:#0b0f14;--bg2:#10161d;--card:#151c25;--card2:#1b2430;--line:#243040;
  --tx:#e8eef5;--mut:#8b9aad;--acc:#3fe0a5;--acc2:#2bb585;--accfg:#04251a;
  --warn:#f5b84b;--bad:#ff6b6b;--ok:#3fe0a5;--shadow:0 10px 30px rgba(0,0,0,.35);
  --c1:#3fe0a5;--c2:#5aa9ff;--c3:#f5b84b;--c4:#c084fc;--c5:#ff7a90;--c6:#7dd3fc;--c7:#a3e635;
  --r:16px;--nav:64px;
}
:root[data-theme=light]{
  --bg:#f3f6f9;--bg2:#e9eef3;--card:#ffffff;--card2:#f1f5f9;--line:#dbe3ec;
  --tx:#0f1b2a;--mut:#5d6f84;--acc:#0e9f6e;--acc2:#0b7d57;--accfg:#fff;
  --warn:#c77d00;--bad:#d63b3b;--ok:#0e9f6e;--shadow:0 10px 30px rgba(20,40,70,.12);
  --c1:#0e9f6e;--c2:#2563eb;--c3:#d97706;--c4:#9333ea;--c5:#e11d48;--c6:#0891b2;--c7:#65a30d;
}
:root[data-theme=gold]{
  --bg:#0f0d0a;--bg2:#17130e;--card:#1c1710;--card2:#262016;--line:#3a3022;
  --tx:#f4ecdc;--mut:#a39880;--acc:#e8b84a;--acc2:#c99a2e;--accfg:#241a00;
  --ok:#9ad06b;--c1:#e8b84a;--c2:#d98c5f;--c3:#9ad06b;--c4:#c792ea;--c5:#e86b6b;--c6:#6fc3c3;--c7:#e8d44a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.mut{color:var(--mut)}.sm{font-size:12.5px}.right{text-align:right}.grow{flex:1}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* кнопки/поля */
.btn{border:1px solid var(--line);background:var(--card2);padding:10px 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:.15s}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--accfg);border-color:transparent;font-weight:700}
.btn.pri:hover{background:var(--acc2)}
.btn.bad{color:var(--bad)}.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ic{border:0;background:transparent;color:var(--mut);padding:8px;border-radius:10px;cursor:pointer;display:inline-flex}
.ic:hover{color:var(--tx);background:var(--card2)}
.inp{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mut)}
textarea.inp{min-height:76px;resize:vertical}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:99px;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--mut)}
.chip.on{background:var(--acc);color:var(--accfg);border-color:transparent;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.tag{font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--card2);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}

/* экран входа */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px;
  background:radial-gradient(900px 500px at 20% -10%,color-mix(in srgb,var(--acc) 18%,transparent),transparent),radial-gradient(700px 500px at 110% 110%,color-mix(in srgb,var(--c2) 14%,transparent),transparent),var(--bg)}
.gate .box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 24px;box-shadow:var(--shadow)}
.lockbadge{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,var(--acc),var(--c2));display:grid;place-items:center;color:var(--accfg);margin:0 auto 14px}
.lockbadge svg{width:30px;height:30px}
.gate h1{text-align:center;font-size:22px}.gate p{text-align:center;margin:6px 0 18px}
.meter{display:flex;gap:4px;margin-top:2px}.meter i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.reccode{font:700 20px/1.5 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;text-align:center;background:var(--bg2);border:1px dashed var(--acc);border-radius:14px;padding:16px 8px;user-select:all}

/* каркас */
.shell{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:16px 16px calc(var(--nav) + 28px);max-width:1100px;margin:0 auto;width:100%}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.top h1{font-size:22px;flex:1}
.nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;cursor:pointer}
.nav button.on{color:var(--acc)}
@media(min-width:900px){
  .nav{display:none}.main{padding-bottom:40px}
  .side{display:flex;flex-direction:column;gap:4px;width:220px;padding:20px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--bg2)}
  .side .brand{font-weight:800;font-size:18px;padding:6px 12px 18px;display:flex;gap:10px;align-items:center}
  .side button.nv{display:flex;gap:12px;align-items:center;border:0;background:none;color:var(--mut);padding:11px 12px;border-radius:12px;cursor:pointer;font-size:15px;text-align:left}
  .side button.nv:hover{background:var(--card)}.side button.nv.on{background:var(--card);color:var(--acc)}
}

/* карточки */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,var(--card)),var(--card) 70%);border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line))}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:4px 0 10px}
.curs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.cur{background:var(--card2);border-radius:12px;padding:8px 12px;min-width:0}
.sheet .grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.cur b{display:block;font-size:16px}
.sect{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.sect h2{font-size:16px}
.money{transition:filter .2s}

/* списки */
.item{display:flex;gap:12px;align-items:center;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:.15s}
.item:hover{border-color:var(--acc);transform:translateY(-1px)}
.item+.item{margin-top:8px}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:var(--accfg);flex:none}
.item .t{font-weight:600}.item .amt{font-weight:700;text-align:right;white-space:nowrap}
.days{min-width:62px;text-align:center;border-radius:12px;padding:6px 6px;background:var(--card2);font-size:12px}
.days b{display:block;font-size:18px;line-height:1.1}
.days.bad{color:var(--bad)}.days.warn{color:var(--warn)}
.empty{text-align:center;padding:36px 10px;color:var(--mut)}

/* графики */
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.chart text{fill:var(--mut);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;box-shadow:var(--shadow);transform:translate(-50%,-110%);white-space:nowrap;z-index:5}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}.legend i{width:10px;height:10px;border-radius:3px;flex:none}.legend span:last-child{margin-left:auto;color:var(--mut)}

/* модалка */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px 18px 24px;animation:up .46s cubic-bezier(.34,1.35,.64,1)}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(46px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.hist{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--acc);padding:10px 16px;border-radius:12px;z-index:60;box-shadow:var(--shadow)}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;cursor:pointer;color:var(--mut);font-size:13px}
.seg button.on{background:var(--card2);color:var(--tx)}
.swatch{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);cursor:pointer}
.swatch.on{border-color:var(--acc)}

/* ===== v2: анимации ===== */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes arc{from{stroke-dasharray:0 100}}
@keyframes grw{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes sweep{to{background-position:-200% 0}}
@keyframes drop{from{transform:translate(-50%,-34px);opacity:0}}
@keyframes spoil{to{background-position:5px 5px,9px 7px}}
@keyframes down{to{transform:translateY(40px);opacity:0}}
@keyframes fadeout{to{opacity:0}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.2,.8,.2,1) .05s forwards}
.arc{animation:arc .95s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fadein .8s .55s both}
.grw{animation:grw .75s cubic-bezier(.34,1.3,.64,1) both}
.fresh .card,.fresh .item,.fresh .sect,.fresh .seg{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*32ms)}
.fresh .grid>.card:nth-child(1){--i:2}.fresh .grid>.card:nth-child(2){--i:3}
.fresh .hc{animation:fadein .5s both;animation-delay:calc(var(--i,0)*14ms + 250ms)}
.ov.out{animation:fadeout .19s forwards}.ov.out .sheet{animation:down .19s cubic-bezier(.3,0,.2,1) forwards}
.skl{border-radius:8px;background:linear-gradient(90deg,var(--card2) 0,color-mix(in srgb,var(--card2) 60%,var(--tx) 14%) 50%,var(--card2) 100%);background-size:200% 100%;animation:sweep 1.2s linear infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}

/* ===== v2: дашборд ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:color-mix(in srgb,var(--card2) 86%,transparent);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .kv{font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.dl{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.dl.up{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}.dl.dn{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.spark{width:100%;height:30px;margin-top:6px;overflow:visible;display:block}
.bar{height:12px;border-radius:99px;background:var(--card2);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--acc);transform-origin:left}
.bar i.f{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--acc) 38%,transparent) 0 6px,transparent 6px 12px)}
.bar i.g{animation:growx 1s cubic-bezier(.2,.8,.2,1) both}
.heat{display:grid;gap:3px;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-template-columns:repeat(27,1fr)}
.hlab{display:grid;grid-template-columns:repeat(27,1fr);font-size:10.5px;color:var(--mut);margin-bottom:4px;gap:3px}.hlab span{white-space:nowrap}
.hc{aspect-ratio:1;border-radius:3px;background:var(--card2);cursor:pointer;position:relative;display:block}
.hc.l1{background:color-mix(in srgb,var(--acc) 28%,var(--card2))}.hc.l2{background:color-mix(in srgb,var(--acc) 48%,var(--card2))}
.hc.l3{background:color-mix(in srgb,var(--acc) 72%,var(--card2))}.hc.l4{background:var(--acc)}
.hc.pst{opacity:.4}.hc.td{outline:1.5px solid var(--tx);outline-offset:1px}.hc.sel{outline:2px solid var(--acc);outline-offset:1px;opacity:1}
.hc.ro::after{content:"";position:absolute;inset:32%;border-radius:50%;background:var(--c2)}
.hdot{width:9px;height:9px;border-radius:50%;background:var(--c2);display:inline-block}

/* ===== v2: интерактив ===== */
.btn.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.btn.hold .fill{position:absolute;inset:0;width:0;background:color-mix(in srgb,currentColor 24%,transparent);transition:width .12s}
.btn.hold.holding .fill{width:100%;transition:width var(--hold,.8s) linear}
.btn.hold>span:last-child{position:relative}
.toast.u{display:flex;gap:14px;align-items:center}
.isle{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--acc);border-radius:99px;padding:7px 15px;z-index:70;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);cursor:pointer;animation:drop .4s cubic-bezier(.34,1.56,.64,1);font-size:13px}
.isle svg{width:16px;height:16px;color:var(--acc)}
.ov.top{align-items:flex-start;padding:10vh 12px 0}.ov.top .sheet{border-radius:18px;max-height:70vh;padding:10px}.ov.top .grab{display:none}
.pal-i{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;cursor:pointer}
.pal-i.on{background:var(--card2)}.pal-i small{margin-left:auto;color:var(--mut);white-space:nowrap}
kbd{border:1px solid var(--line);border-radius:6px;padding:0 6px;font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--mut);background:var(--bg2)}
.grab{display:none;width:44px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 12px;touch-action:none;cursor:grab}
@media(max-width:699px){.grab{display:block}}
.orow{display:grid;grid-template-columns:1.5fr .8fr .8fr 1.1fr .8fr auto;gap:6px;align-items:center}
@media(max-width:560px){.orow{grid-template-columns:1fr 1fr 1fr}.orow .ic{justify-self:end}}
.orow .inp{padding:8px 9px;min-width:0}

/* спойлер вместо блюра */
.hide .money{color:transparent!important;position:relative;display:inline-block;user-select:none;cursor:pointer}
.hide .money::after{content:"";position:absolute;inset:-1px -2px;border-radius:6px;pointer-events:none;opacity:.6;
  background:radial-gradient(circle at 25% 30%,var(--mut) 0 .9px,transparent 1.5px) 0 0/5px 5px,radial-gradient(circle at 70% 65%,var(--tx) 0 .7px,transparent 1.3px) 2px 1px/7px 6px;animation:spoil 1.4s steps(5) infinite}
.hide .money.rv{color:inherit!important}.hide .money.rv::after{display:none}
.hide text.money{fill:transparent!important;filter:blur(6px)}.hide text.money.rv{fill:var(--tx)!important;filter:none}
.hide .legend .money{display:inline}

.hc{aspect-ratio:auto;height:14px}
@media(min-width:760px){.hc{height:22px}.heat{gap:4px}.hlab{gap:4px}}
.legend-hc{display:inline-block;width:12px;height:12px}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tb{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
.tb th,.tb td{padding:6px 6px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tb th{font-weight:600;font-size:12px;white-space:nowrap}
.tb .inp{padding:7px 9px;min-width:92px;font-size:13px}
@media(max-width:899px){.nav button{font-size:10.5px}}

.seg{max-width:100%;overflow-x:auto;flex-wrap:nowrap}.seg button{white-space:nowrap}

</style>
</head>

<div id="app"></div>

/* ---------- демо (вымышленные данные) ---------- */

    P({ type: 'Крипта', where: 'Холодный кошелёк', cur: 'USD', comment: 'Seed-фраза в сейфе, не здесь.', history: hist(1800, 60, 250, 12, .004) }),
    P({ type: 'Наличные', where: 'Заначка', cur: 'USD', history: hist(1500, 0, 0, 3) }),
    P({ type: 'Банковский вклад', where: 'Банк Запад · вклад 6 мес', cur: 'RUB', rate: 14.2, open: addDays(T, -184), close: addDays(T, -2), cond: 'Срок вышел — забрать или продлить.', history: hist(200000, 6000, 3000, 6, .01) }),

/* ---------- импорт Excel ---------- */
const guessCur = (...s) => { const t = s.join(' ').toLowerCase(); if (/каспи|евраз|форте|береке|\bкз|тенге/.test(t)) return 'KZT'; if (/крипт|bybit|exmo|trust|usdt|btc|долл|\$/.test(t)) return 'USD'; return 'RUB'; };
const isSerial = v => typeof v === 'number' && v > 36526 && v < 73050;
const serialISO = n => new Date((Math.floor(n) - 25569) * 864e5).toISOString().slice(0, 10);
function anyDate(v) {
  if (isSerial(v)) return serialISO(v);
  if (typeof v === 'string') { const m = v.trim().match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})$/); if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${pad(m[2])}-${pad(m[1])}`; } }

}
function sheetReader(ws) {
  const ref = XLSX.utils.decode_range(ws['!ref'] || 'A1:A1');
  return { r0: ref.s.r, r1: ref.e.r, c0: ref.s.c, c1: ref.e.c, get: (r, c) => { const x = ws[XLSX.utils.encode_cell({ r, c })]; return x ? x.v : null; } };
}

  t = String(t || '').trim(); if (!t) return 'Банковский вклад'; if (TYPES.includes(t)) return t; const l = t.toLowerCase();
  if (/накоп/.test(l)) return 'Накопительный счёт'; if (/краудл|займ|заём/.test(l)) return 'Краудлендинг'; if (/крипт|bybit|биткоин/.test(l)) return 'Крипта';
  if (/инвест|брокер|акци|офз/.test(l)) return 'Инвестиции'; if (/налич/.test(l)) return 'Наличные'; if (/вклад|депозит/.test(l)) return 'Банковский вклад';
  if (/счет|счёт|карт|каспи|kaspi|сбер|тинь/.test(l)) return 'Счёт / карта'; return t;
}
const sv = v => String(v ?? '').trim();

function importMovement(ws) {
  const S = sheetReader(ws); let hr = -1, tc = -1;
  for (let r = S.r0; r <= Math.min(S.r1, S.r0 + 12) && hr < 0; r++) for (let c = S.c0; c <= S.c1; c++) if (sv(S.get(r, c)).toLowerCase() === 'тип') { hr = r; tc = c; break; }
  if (hr < 0) return null;
  const col = {}; const dcols = [];
  for (let c = S.c0; c <= S.c1; c++) {
    const v = S.get(hr, c);
    if (isSerial(v)) { dcols.push([c, serialISO(v)]); continue; }
    const t = sv(v).toLowerCase();
    if (t === 'где') col.where = c; else if (t === 'условия') col.cond = c; else if (t === 'дата открытия') col.open = c;
    else if (t === 'дата закрытия') col.close = c; else if (t === 'дата изменения') col.chd = c; else if (t === 'сумма изменения') col.cha = c; else if (t.startsWith('комментар')) col.cm = c;
  }
  const out = [];
  for (let r = hr + 1; r <= S.r1; r++) {
    const raw = sv(S.get(r, tc)); if (!raw) continue;
    const [base, ...rest] = raw.split('_'); const extra = rest.join('_').trim();
    const where = sv(col.where != null ? S.get(r, col.where) : '') || extra || '';
    const history = [];
    for (const [c, d] of dcols) { const v = S.get(r, c); if (typeof v === 'number') history.push({ d, amt: v }); else if (history.length && history[history.length - 1].amt !== 0 && sv(v)) history.push({ d, amt: 0 }); /* «переведено», «-» после сумм = деньги ушли */ }
    const cond = sv(col.cond != null ? S.get(r, col.cond) : '');
    const open = col.open != null ? anyDate(S.get(r, col.open)) : '', close = col.close != null ? anyDate(S.get(r, col.close)) : '';
    let comment = sv(col.cm != null ? S.get(r, col.cm) : '');
    if (col.chd != null) { const cd = anyDate(S.get(r, col.chd)), ca = col.cha != null ? S.get(r, col.cha) : null; if (cd || ca != null) comment = (comment ? comment + '\n' : '') + `Изменение ${cd ? fmtDate(cd) : ''}${ca != null ? ': ' + ca : ''}`.trim(); }
    if (!history.length && !where && !cond && !open && !close && !comment) continue;

    history.sort((a, b) => a.d < b.d ? -1 : 1);

    out.push({ id: uid(), type: normType(base), where: where || base.trim(), cur: guessCur(raw, where), rate: m ? Number(m[1].replace(',', '.')) : '', cond, open, close, reopen: '', comment, history, archived: history.length > 0 && history[history.length - 1].amt === 0 });

function importState(ws) {
  const S = sheetReader(ws); let hr = -1, dc = -1;
  for (let r = S.r0; r <= Math.min(S.r1, S.r0 + 12) && hr < 0; r++) for (let c = S.c0; c <= S.c1; c++) if (sv(S.get(r, c)).toLowerCase().startsWith('дата/место')) { hr = r; dc = c; break; }
  if (hr < 0) return null;

function importThoughts(ws) {

  return out;
}

/** -> [{key,title,desc,count,positions?,notes?,def}] */
function parseWorkbook(buf) {
  const wb = XLSX.read(buf, { type: 'array' }); const found = [];
  for (const name of wb.SheetNames) {
    const ws = wb.Sheets[name]; if (!ws['!ref']) continue; const n = name.toLowerCase();
    if (n.includes('движение')) { const p = importMovement(ws); if (p) found.push({ key: name, title: name, desc: 'позиции: вклады, краудлендинг, крипта… с историей сумм, условиями и датами', count: p.length, positions: p, def: true }); }
    else if (n.includes('состояние')) { const p = importState(ws); if (p) found.push({ key: name, title: name, desc: 'остатки по местам (карты, счета, биржи). Это те же деньги в другой разбивке — выбирай ОДИН из двух листов', count: p.length, positions: p, def: false }); }
    else if (n.includes('крипт') && n.includes('клал')) { const c = importCrypto(ws); if (c) found.push({ key: name, title: name, desc: 'вложения в крипту → раздел «Анализ»: что было бы в банке', count: c.rows.length, an: { crypto: c }, def: true }); }
    else if (n.includes('отправлял')) { const h = importHome(ws); if (h) found.push({ key: name, title: name, desc: 'переводы в Казахстан → «Анализ → Переводы в КЗ»', count: h.rows.length, an: { home: h }, def: true }); }
    else if (n.includes('сравнение')) { const c = importCmp(ws); if (c) found.push({ key: name, title: name, desc: 'РФ или КЗ: ставки и сценарии курса → «Анализ → РФ или КЗ»', count: c.fxs.length, an: { cmp: c }, def: true }); }
    else if (n.includes('налогов')) { const t = importTax(ws); if (t) found.push({ key: name, title: name, desc: 'заметки про налог с вкладов → «Анализ → Налог» (там же калькулятор)', count: t.notes.length, an: { tax: t }, def: true }); }
    else if (n.includes('по годам')) { const y = importYears(ws); if (y) found.push({ key: name, title: name, desc: 'годы: начало/конец, расходы, проценты → «Анализ → По годам»', count: y.length, an: { years: y }, def: true }); }
    else if (n.includes('банков')) { const b = importBanks(ws); if (b) found.push({ key: name, title: name, desc: 'снимки ставок банков по датам → «Анализ → Банки»', count: b.length, an: { banks: b }, def: true }); }
    else if (n.includes('мысли')) { const nt = importThoughts(ws); found.push({ key: name, title: name, desc: 'заметки с датами → раздел «Заметки»', count: nt.length, notes: nt, def: true }); }
  }
  return found;
}

function makeOffers() {
  const O = (bank, cur, rate, max, term, note = '') => ({ id: uid(), bank, cur, rate, max, term, note });
  return [O('Банк Север', 'RUB', 15.5, 1000000, 3), O('Банк Восток', 'RUB', 16.2, 300000, 2), O('Банк Горизонт', 'RUB', 14.8, '', 6), O('Банк Степь', 'KZT', 18, 5000000, 3), O('Банк Алтын', 'KZT', 17.2, '', 6)];
}
function migrate(d) {
  d.tomb = d.tomb || {};
  const s = d.settings = d.settings || {}; s.rates = s.rates || { KZT: 0.16, USD: 82 }; if (s.autolock == null) s.autolock = 3;
  if (!Array.isArray(s.offers)) s.offers = []; if (!('goal' in s)) s.goal = null;
  for (const p of d.positions) if (!('limit' in p)) p.limit = '';
  return d;

const moneyC = (n, c, mode) => `<span class="money" data-count="${n}" data-cur="${c}"${mode ? ` data-mode="${mode}"` : ''}>${fmt(n, c)}</span>`;

/* ---- данные для графиков ---- */

/** ожидаемая выплата к дате закрытия (простые проценты, оценка) */

let CH = null;

/* ---- кольцо-структура ---- */

  let parts = Object.entries(g).sort((a, b) => b[1] - a[1]); if (S.dmode === 'place' && parts.length > 7) { const rest = parts.slice(6).reduce((s, x) => s + x[1], 0); parts = [...parts.slice(0, 6), ['Прочее', rest]]; }
  const tot = parts.reduce((s, x) => s + x[1], 0); if (!tot) return '<div class="empty">Нет данных</div>';

  return `<div class="donut"><svg viewBox="0 0 140 140" width="150" height="150">${arcs}<text x="70" y="68" text-anchor="middle" style="fill:var(--tx);font-weight:800;font-size:15px" class="money" data-count="${tot}" data-mode="short">${short(tot)}</text><text x="70" y="84" text-anchor="middle" style="font-size:10px;fill:var(--mut)">в рублях</text></svg>

/* ---- столбики: прирост по годам ---- */
function yearBars() {
  const T = todayISO(), all = S.data.positions.flatMap(p => p.history.map(h => h.d)).sort(); if (!all.length) return '<div class="empty">Нет данных</div>';
  const y0 = +all[0].slice(0, 4), y1 = +T.slice(0, 4), rows = [];
  for (let y = y0; y <= y1; y++) { const a = y === y0 ? all[0] : `${y - 1}-12-31`, b = y === y1 ? T : `${y}-12-31`, va = totalAt(a), vb = totalAt(b); rows.push({ y, d: vb - va, pc: va > 0 ? (vb - va) / va * 100 : null, partial: y === y1 || y === y0 }); }
  const mx = Math.max(...rows.map(r => Math.abs(r.d)), 1), W = 300, H = 150, base = H - 34, bw = Math.min(54, (W - 20) / rows.length - 14), step = (W - 20) / rows.length;

    return `<g><title>${r.y}: ${r.d >= 0 ? '+' : ''}${nf.format(Math.round(r.d))} ₽${r.pc != null ? ` (${r.pc.toFixed(1)}%)` : ''}</title><rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="${Math.min(10, bw / 2)}" fill="${up ? 'var(--acc)' : 'var(--bad)'}" opacity="${r.partial ? .6 : 1}" class="${animNow ? 'grw' : ''}" style="transform-origin:${x + bw / 2}px ${base}px;animation-delay:${i * 90}ms"/>

}

/* ---- календарь закрытий (heatmap) ---- */
function heatmap() {
  const T = todayISO(), dow = (new Date(dnum(T) * 864e5).getUTCDay() + 6) % 7, start = addDays(T, -dow), W = 27;
  const byDay = {}; for (const e of events()) { const o = byDay[e.d] || (byDay[e.d] = { sum: 0, close: 0, reopen: 0 }); if (e.k === 'close') { o.close++; o.sum += rubOf(e.p); } else o.reopen++; }
  const sums = Object.values(byDay).map(o => o.sum).filter(v => v > 0).sort((a, b) => a - b);
  const lvl = v => { if (v <= 0 || !sums.length) return 0; const r = sums.indexOf(v) / Math.max(1, sums.length - 1); return sums.length === 1 ? 4 : r < .25 ? 1 : r < .5 ? 2 : r < .8 ? 3 : 4; };
  let labs = '', cells = '', lastM = -1;
  for (let w = 0; w < W; w++) {
    const dt = new Date(dnum(addDays(start, w * 7)) * 864e5), m = dt.getUTCMonth();
    if (m !== lastM && (w === 0 || dt.getUTCDate() <= 7)) { labs += `<span style="grid-column:${w + 1}">${MON[m]}</span>`; lastM = m; }
    for (let d = 0; d < 7; d++) {
      const date = addDays(start, w * 7 + d), o = byDay[date];
      cells += `<i class="hc l${o ? lvl(o.sum) : 0} ${date < T ? 'pst' : ''} ${date === T ? 'td' : ''} ${o && o.reopen ? 'ro' : ''} ${S.hday === date ? 'sel' : ''}" data-a="hday" data-id="${date}" style="--i:${w}" title="${fmtDate(date)}"></i>`;
    }
  }
  return `<div class="hlab">${labs}</div><div class="heat">${cells}</div>
  <div class="row sm mut" style="margin-top:8px;gap:6px"><span>меньше</span>${[0, 1, 2, 3, 4].map(l => `<i class="hc l${l} legend-hc"></i>`).join('')}<span>больше денег на закрытии</span><span class="grow"></span><span class="hdot"></span><span>можно открыть снова</span></div>
  <div id="hdetail" style="margin-top:10px">${heatDetail(S.hday)}</div>`;
}
function heatDetail(date) {
  if (!date) return '<div class="sm mut">Нажми на клетку, чтобы увидеть, что в этот день.</div>';
  const L = events().filter(e => e.d === date);
  return `<div class="sm mut" style="margin-bottom:6px">${fmtDate(date)}</div>` + (L.length ? L.map(evItem).join('') : '<div class="sm mut">В этот день ничего не происходит.</div>');
}

/* ---- цель ---- */
function goalCard() {

  if (!g) return `<div class="card col"><h3>Цель</h3><div class="sm mut">Поставь цель — приложение покажет, сколько не хватает и сколько откладывать в месяц.</div><button class="btn" data-a="goal">${ic('plus')}Поставить цель</button></div>`;
  const T = todayISO(), now = totals().rub, val = fcFn(), at = val(g.date), pc = Math.min(100, now / g.amount * 100), fpc = Math.min(100, Math.max(at, now) / g.amount * 100);
  const left = daysTo(g.date), months = Math.max(.5, left / 30.4), need = Math.max(0, g.amount - at), perM = need / months;
  const verdict = left < 0 ? `<span class="tag bad">срок прошёл</span>` : need <= 0 ? `<span class="tag ok">по прогнозу хватает</span>` : `<span class="tag warn">нужно откладывать ≈ ${money(perM, 'RUB')} / мес</span>`;
  return `<div class="card col"><div class="row"><h3 class="grow">${esc(g.name || 'Цель')}</h3><button class="ic" data-a="goal">${ic('gear')}</button></div>
  <div class="row" style="align-items:baseline"><b style="font-size:24px" class="money">${fmt(now, 'RUB')}</b><span class="mut">из ${money(g.amount, 'RUB')} · ${Math.round(pc)}%</span></div>
  <div class="bar"><i class="f ${animNow ? 'g' : ''}" style="width:${fpc}%"></i><i class="${animNow ? 'g' : ''}" style="width:${pc}%"></i></div>
  <div class="sm mut">К ${fmtDate(g.date)} (${left < 0 ? 'прошло ' + (-left) : 'через ' + left} дн.) по прогнозу без новых пополнений будет ≈ ${money(at, 'RUB')}</div>${verdict}</div>`;
}

<script>
/* интерактив в духе Kokonut: удержание, undo, палитра команд, остров автоблока, свайпы, шторка, FLIP */
const holdBtn = (text, act, cls = '', ms = 800) => `<button type="button" class="btn hold ${cls}" data-hold="${act}" data-ms="${ms}" style="--hold:${ms}ms"><span class="fill"></span><span>Удерживай: ${text}</span></button>`;

function undoToast(text, fn, ms = 6500) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div'); el.className = 'toast u'; el.innerHTML = `<span>${esc(text)}</span><button class="btn sm pri">Отменить</button>`;
  el.querySelector('button').onclick = () => { el.remove(); fn(); }; document.body.appendChild(el); setTimeout(() => el.remove(), ms);
}

/* FLIP: плавная перестановка строк при фильтре/поиске */
const flipSnap = () => { const m = {}; document.querySelectorAll('.item[data-id]').forEach(e => m[e.dataset.id] = e.getBoundingClientRect().top); return m; };
function flipPlay(m) {
  if (RM) return;
  document.querySelectorAll('.item[data-id]').forEach(e => {
    const o = m[e.dataset.id];
    if (o == null) { e.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }); return; }
    const dy = o - e.getBoundingClientRect().top; if (Math.abs(dy) > 1) e.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 340, easing: 'cubic-bezier(.34,1.3,.64,1)' });
  });
}

function closeModal(id = 'ov', instant = false) {

  if (instant || RM) { o.remove(); return; }
  o.classList.add('out'); o.removeAttribute('id'); setTimeout(() => o.remove(), 190);
}

/* шторка: тянется вниз пальцем, пружинит назад */
function bindSheetDrag(ov) {
  const sh = ov.querySelector('.sheet'), g = ov.querySelector('.grab'); if (!g) return;
  let y0 = 0, dy = 0, t0 = 0, on = false;
  g.addEventListener('pointerdown', e => { on = true; y0 = e.clientY; t0 = performance.now(); dy = 0; g.setPointerCapture(e.pointerId); sh.style.animation = 'none'; });
  g.addEventListener('pointermove', e => { if (!on) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`; });

    else { sh.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 440, easing: 'cubic-bezier(.34,1.56,.64,1)' }); sh.style.transform = ''; }
  };

/* палитра команд (Ctrl+K) */
function openPalette() {
  if (!S.data) return;
  const items = () => [
    ...TABS.map(([k, t, i]) => ({ l: 'Перейти: ' + t, h: 'раздел', i, run: () => { S.tab = k; S.q = ''; S.filter = 'Все'; S.fresh = true; render(); scrollTo(0, 0); } })),
    { l: 'Добавить позицию', h: 'действие', i: 'plus', run: () => openPos(null) },
    { l: S.data.settings.hide ? 'Показать суммы' : 'Скрыть суммы', h: 'действие', i: 'eye', run: () => { S.data.settings.hide = !S.data.settings.hide; persist(); render(); } },
    { l: 'Заблокировать', h: 'действие', i: 'lock', run: lock },
    { l: 'Цель накопления', h: 'действие', i: 'gear', run: openGoal },
    { l: 'Ставки банков', h: 'справочник', i: 'list', run: openOffers },
    { l: 'Импорт из Excel', h: 'данные', i: 'xls', run: () => actions('xlsx', { dataset: {} }) },
    ...S.data.positions.filter(p => !p.archived).map(p => ({ l: p.where, h: `${esc(p.type)} · <span class="money">${fmt(lastAmt(p), p.cur)}</span>`, i: 'list', hh: 1, run: () => openPos(p.id) })),
  ];
  let sel = 0, list = [];
  modal(`<input class="inp" id="pq" placeholder="Позиция или команда…" autocomplete="off"><div id="pl" style="margin-top:8px"></div><div class="sm mut" style="padding:8px 4px 0"><kbd>↑↓</kbd> выбрать · <kbd>Enter</kbd> открыть · <kbd>Esc</kbd> закрыть</div>`, ov => {
    ov.classList.add('top'); const q = $('#pq', ov), pl = $('#pl', ov);
    const draw = () => {
      const w = q.value.toLowerCase().split(/\s+/).filter(Boolean); const all = items();
      list = all.filter(x => w.every(t => (x.l + ' ' + x.h.replace(/<[^>]+>/g, '')).toLowerCase().includes(t))).slice(0, 9); sel = Math.min(sel, Math.max(0, list.length - 1));
      pl.innerHTML = list.length ? list.map((x, i) => `<div class="pal-i ${i === sel ? 'on' : ''}" data-n="${i}">${ic(x.i)}<span>${esc(x.l)}</span><small>${x.hh ? x.h : esc(x.h)}</small></div>`).join('') : '<div class="empty">Ничего не найдено</div>';
    };
    const go = i => { const it = list[i]; if (!it) return; closeModal('ovk'); setTimeout(it.run, 30); };
    q.addEventListener('input', () => { sel = 0; draw(); });
    q.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { sel = Math.min(list.length - 1, sel + 1); draw(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); }
      else if (e.key === 'Enter') { go(sel); e.preventDefault(); }
    });
    pl.addEventListener('click', e => { const r = e.target.closest('[data-n]'); if (r) go(+r.dataset.n); });

}

  <div class="row" style="justify-content:space-between">${fresh ? '<span></span>' : `<button type="button" class="btn" data-x="del">Удалить</button>`}<button class="btn pri">Сохранить</button></div></form>`, ov => {
    ov.addEventListener('click', async e => { const b = e.target.closest('[data-x]'); if (!b) return; if (b.dataset.x === 'c') closeModal(); if (b.dataset.x === 'del' && await ask('Удалить год ' + y.y + '?', 'Удалить', true)) { a.years = a.years.filter(x => x.id !== y.id); anSave(true); closeModal(); } });
    $('#yf', ov).addEventListener('submit', e => { e.preventDefault(); const f = new FormData(e.target), yy = +f.get('y'); if (!(yy >= 2000 && yy < 2100)) return toast('Год вида 2026');
      const o = { ...y, y: yy }; AN_YF.forEach(([k]) => { const v = f.get(k); o[k] = v === '' ? '' : (num(v) ?? ''); }); if (fresh) a.years.push(o); else Object.assign(y, o); anSave(true); closeModal(); });
  });
}

<script>

const ICO = {

};
const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24">${ICO[n]}</svg>`;
const typeColor = t => { const i = TYPES.indexOf(t); return `var(--c${(i < 0 ? (t.length % 7) : i) + 1})`; };

/* ===== модель ===== */
const newData = demo => ({ v: 1, positions: demo ? makeDemo().positions : [], notes: demo ? makeDemo().notes : [], settings: { rates: { KZT: 0.16, USD: 82 }, autolock: 3, hide: false, offers: demo ? makeOffers() : [], goal: demo ? { name: 'Накопить к концу года', amount: 4500000, date: todayISO().slice(0, 4) + '-12-31' } : null } });
const rateOf = c => c === 'RUB' ? 1 : (S.data.settings.rates[c] || 0);
const act = () => S.data.positions.filter(p => !p.archived);
const rubOf = (p, d) => lastAmt(p, d) * rateOf(p.cur);
function totals() {
  const by = { RUB: 0, KZT: 0, USD: 0 }; let rub = 0;
  for (const p of act()) { const a = lastAmt(p); by[p.cur] = (by[p.cur] || 0) + a; rub += a * rateOf(p.cur); }
  return { by, rub };
}
const totalAt = d => S.data.positions.reduce((s, p) => s + rubOf(p, d), 0);
function series() {
  const all = [...new Set(S.data.positions.flatMap(p => p.history.map(h => h.d)))].sort();
  let ds = all; if (S.range !== 'all') { const cut = addDays(todayISO(), -Number(S.range) * 30); ds = all.filter(d => d >= cut); if (ds.length < 2) ds = all; }
  return ds.map(t => ({ t, v: totalAt(t) }));
}
function events() {
  const ev = [];
  for (const p of act()) { if (p.close) ev.push({ d: p.close, k: 'close', p }); if (p.reopen) ev.push({ d: p.reopen, k: 'reopen', p }); }
  return ev.map(e => ({ ...e, n: daysTo(e.d) })).filter(e => e.k === 'close' || e.n >= -30).sort((a, b) => a.d < b.d ? -1 : 1);
}
let saveChain = Promise.resolve();
function persist() {
  saveChain = saveChain.then(async () => { try { if (!S.session) return; Sync.stamp(S.data); const b = await S.session.save(S.data); LS.set('sv_vault', JSON.stringify(b)); Sync.queue(); } catch (e) { toast('Не удалось сохранить: ' + e.message); } });
  return saveChain;
}

/* ===== мелочи UI ===== */
function toast(t, ms = 2600) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), ms); }
const money = (n, c) => `<span class="money">${fmt(n, c)}</span>`;

/* ===== экраны входа ===== */
function gate(inner) { $app.className = ''; $app.innerHTML = `<div class="gate"><div class="box"><div class="lockbadge">${ic('lock')}</div>${inner}</div></div>`; }
function meterHTML(sc) { const cols = ['var(--bad)', 'var(--bad)', 'var(--warn)', 'var(--ok)', 'var(--ok)']; return [0, 1, 2, 3].map(i => `<i style="background:${sc > i ? cols[sc] : 'var(--line)'}"></i>`).join(''); }

function renderSetup() {
  gate(`<h1>Мои накопления</h1><p class="mut sm">Данные шифруются на этом устройстве. Придумай мастер-пароль — его нигде не хранят, и восстановить его без ключа нельзя.</p>
  <form id="f" class="col" autocomplete="off">
    <label class="f">Мастер-пароль (лучше фраза из 4–5 слов)<input class="inp" id="p1" type="password" autocomplete="new-password"></label>
    <div class="meter" id="mt">${meterHTML(0)}</div><div class="sm mut" id="mh">минимум 10 символов</div>
    <label class="f">Повтори пароль<input class="inp" id="p2" type="password" autocomplete="new-password"></label>
    <label class="row sm"><input type="checkbox" id="demo" checked> Заполнить вымышленными демо-данными (потом очистишь)</label>

  const p1 = $('#p1'); p1.focus();
  p1.addEventListener('input', () => { const s = Vault.strength(p1.value); $('#mt').innerHTML = meterHTML(p1.value ? s.score : 0); $('#mh').textContent = p1.value ? `${['слабый', 'так себе', 'нормальный', 'хороший', 'отличный'][s.score]} · ~${s.bits} бит` : 'минимум 10 символов'; });
  $('#f').addEventListener('submit', async e => {
    e.preventDefault(); const a = p1.value, b = $('#p2').value, er = $('#er');
    if (a.length < 10) return er.textContent = 'Слишком короткий: нужно минимум 10 символов';
    if (Vault.strength(a).score < 2) return er.textContent = 'Пароль слабоват — добавь слов или символов';
    if (a !== b) return er.textContent = 'Пароли не совпадают';
    $('#go').disabled = true; $('#go').textContent = 'Шифрую…'; await new Promise(r => setTimeout(r, 30));
    const data = newData($('#demo').checked);
    const r = await Vault.create(a, data); S.session = r.session; S.data = data; LS.set('sv_vault', JSON.stringify(r.blob));
    renderRecovery(r.recovery, () => startApp());

}
function renderRecovery(code, done) {
  gate(`<h1>Ключ восстановления</h1><p class="mut sm">Если забудешь мастер-пароль — только этот ключ вернёт доступ. Запиши на бумагу и убери в сейф. В приложении он больше не покажется.</p>
  <div class="reccode">${code}</div>
  <div class="row" style="margin:12px 0"><button class="btn grow" id="cp">Скопировать</button><button class="btn grow" id="pr">Распечатать</button></div>

  $('#pr').onclick = () => { const w = window.open('', '_blank'); if (w) { w.document.write(`<pre style="font:700 28px monospace;margin:60px">Ключ восстановления «Мои накопления»\n\n${code}\n\nХранить в сейфе. Не фотографировать.</pre>`); w.print(); } };
  $('#go').onclick = done;
}
function openConnect() {
  modal(`<h3>Подключить хранилище</h3><p class="sm mut">Скачаю зашифрованный файл из репозитория. Дальше войдёшь тем же мастер-паролем.</p><form id="cf" class="col"><input class="inp" id="cr" placeholder="владелец/репозиторий" autocapitalize="off"><input class="inp" id="ct" type="password" placeholder="Токен GitHub" autocomplete="off"><div class="err" id="er"></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-x="c">Отмена</button><button class="btn pri" id="cg">Подключить</button></div></form>`, ov => {
    ov.addEventListener('click', e => { if (e.target.closest('[data-x=c]')) closeModal(); });
    $('#cf', ov).addEventListener('submit', async e => {
      e.preventDefault(); const repo = $('#cr', ov).value.trim().replace(/^https?:\/\/github\.com\//, ''), token = $('#ct', ov).value.trim(), er = $('#er', ov);
      if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) return er.textContent = 'Нужны репозиторий и токен';

      try { const r = await Sync.fetchVault({ repo, token, path: 'vault.json' }); LS.set('sv_vault', JSON.stringify(r.blob)); LS.del('sv_sha'); LS.del('sv_fails'); closeModal('ov', true); renderUnlock(); toast('Хранилище скачано — введи пароль'); }

}
const failDelay = () => { const n = +LS.get('sv_fails') || 0; return n < 3 ? 0 : Math.min(300, 2 ** (n - 2)); };
function renderUnlock(recMode = false) {
  gate(`<h1>Хранилище закрыто</h1><p class="mut sm">${recMode ? 'Введи ключ восстановления (25 символов)' : 'Введи мастер-пароль'}</p>
  <form id="f" class="col"><input class="inp" id="pw" type="${recMode ? 'text' : 'password'}" placeholder="${recMode ? 'XXXXX-XXXXX-XXXXX-XXXXX-XXXXX' : 'Мастер-пароль'}" autocomplete="${recMode ? 'off' : 'current-password'}" autocapitalize="off">
  <div class="err" id="er"></div><button class="btn pri" id="go">Открыть</button>${!recMode && Bio.ok() && Bio.has() ? '<button type="button" class="btn" id="bio">Войти по отпечатку</button>' : ''}</form>
  <div class="row" style="justify-content:space-between;margin-top:14px"><a href="#" class="sm mut" id="alt">${recMode ? '← по паролю' : 'Забыл пароль?'}</a><a href="#" class="sm mut" id="rs">Сбросить всё</a></div><div style="margin-top:10px"><a href="#" class="sm mut" id="conn">Подключить хранилище с другого устройства</a></div>`);
  $('#pw').focus();
  if ($('#bio')) $('#bio').onclick = async () => { try { const r = await Bio.unlock(); S.session = r.session; S.data = r.data; LS.del('sv_fails'); startApp(); } catch (x) { $('#er').textContent = 'Отпечаток не сработал — введи пароль'; } };
  $('#conn').onclick = e => { e.preventDefault(); openConnect(); };
  $('#alt').onclick = e => { e.preventDefault(); renderUnlock(!recMode); };

  $('#f').addEventListener('submit', async e => {

      $('#go').disabled = false; $('#go').textContent = 'Открыть'; $('#er').textContent = x.message === 'BAD_SECRET' ? (recMode ? 'Ключ не подошёл' : 'Неверный пароль') : 'Ошибка: ' + x.message;
    }
  });
}

/* ===== автоблокировка ===== */
let idleT = null, hiddenAt = 0;
function bumpIdle() { clearTimeout(idleT); if (!S.data) return; const m = S.data.settings.autolock; S.idleAt = Date.now() + m * 60000; if (m > 0) idleT = setTimeout(lock, m * 60000); }
function lock() { clearTimeout(idleT); S.data = null; S.session = null; document.querySelectorAll('.ov').forEach(o => o.remove()); document.querySelectorAll('.toast').forEach(t => t.remove()); renderUnlock(); }
['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(ev => addEventListener(ev, bumpIdle, { passive: true }));
document.addEventListener('visibilitychange', () => {
  if (!S.data) return; if (document.hidden) hiddenAt = Date.now();
  else { const m = S.data.settings.autolock; if (m > 0 && Date.now() - hiddenAt > m * 60000) lock(); }
});

/* ===== каркас ===== */
const TABS = [['home', 'Обзор', 'home'], ['pos', 'Позиции', 'list'], ['dates', 'Даты', 'cal'], ['notes', 'Заметки', 'note'], ['an', 'Анализ', 'chart'], ['set', 'Настройки', 'gear']];

function startApp() {
  migrate(S.data); S.fresh = true; S.tab = 'home'; bumpIdle(); render(); Sync.init();
  if (S.recoveryFlow) { S.recoveryFlow = false; openChangePw(true); }
}
function render() {
  const d = S.data; if (!d) return;
  animNow = S.fresh || S.rc; const full = S.fresh;
  $app.className = d.settings.hide ? 'hide' : '';

    <main class="main ${full ? 'fresh' : ''}">${S.memOnly ? '<div class="banner">Хранилище браузера недоступно — данные живут только до закрытия вкладки. Сделай экспорт копии в Настройках.</div>' : ''}
    <div class="top"><h1>${TITLES[S.tab]}</h1>
      <button class="ic" data-a="palette" title="Поиск и команды (Ctrl+K)">${ic('search')}</button>
      <button class="ic" data-a="hide" title="Скрыть суммы">${ic(d.settings.hide ? 'eyeoff' : 'eye')}</button>
      <button class="ic" data-a="lock" title="Заблокировать">${ic('lock')}</button></div>

/* ===== Обзор ===== */
function viewHome() {
  const d = S.data;
  if (!d.positions.length) return `<div class="card empty"><h2>Пока пусто</h2><p>Добавь первую позицию, импортируй свой Excel или загрузи демо-данные.</p><div class="row wrap" style="justify-content:center"><button class="btn pri" data-a="newPos">${ic('plus')}Добавить позицию</button><button class="btn" data-a="xlsx">${ic('xls')}Импорт из Excel</button><button class="btn" data-a="demo">Демо-данные</button></div></div>`;
  const T = todayISO(), t = totals(), now = t.rub, prev = totalAt(addDays(T, -30)), dl = prev > 0 ? (now - prev) / prev * 100 : null;

    return `<div class="kpi"><div class="row"><span class="mut sm grow">${c}</span>${dd == null ? '' : dchip(dd)}</div><b class="kv">${moneyC(a, c)}</b>${c !== 'RUB' ? `<span class="mut sm">≈ ${money(a * rateOf(c), 'RUB')}</span>` : '<span class="sm">&nbsp;</span>'}${spark(curSeries(c))}</div>`;
  }).join('');

/* ===== Позиции ===== */
function viewPos() {
  const types = ['Все', ...new Set(S.data.positions.filter(p => !p.archived).map(p => p.type)), 'Архив'];
  return `<div class="row" style="margin-bottom:10px"><div class="grow" style="position:relative"><input class="inp" data-i="q" placeholder="Поиск по названию, условиям…" value="${esc(S.q)}" style="padding-left:38px"><span style="position:absolute;left:12px;top:11px;color:var(--mut)">${ic('search')}</span></div><button class="btn pri" data-a="newPos">${ic('plus')}<span class="sm">Добавить</span></button></div>
  <div class="chips" style="margin-bottom:12px">${types.map(t => `<button class="chip ${S.filter === t ? 'on' : ''}" data-a="filter" data-id="${esc(t)}">${esc(t)}</button>`).join('')}</div><div id="plist">${plist()}</div>`;
}
function plist() {
  const q = S.q.toLowerCase(); let L = S.data.positions.filter(p => S.filter === 'Архив' ? p.archived : (!p.archived && (S.filter === 'Все' || p.type === S.filter)));
  if (q) L = L.filter(p => (p.where + ' ' + p.type + ' ' + p.cond + ' ' + p.comment).toLowerCase().includes(q));
  L.sort((a, b) => rubOf(b) - rubOf(a)); if (!L.length) return '<div class="empty">Ничего не найдено</div>';
  return L.map((p, i) => {
    const n = p.close ? daysTo(p.close) : null, a = lastAmt(p), over = p.limit && a > p.limit, po = payoutOf(p);
    return `<div class="item" data-a="editPos" data-id="${p.id}" style="--i:${Math.min(i, 10)}"><div class="dot" style="background:${typeColor(p.type)}">${esc((p.where || '?')[0].toUpperCase())}</div>
    <div class="grow" style="min-width:0"><div class="t" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.where)}</div>
    <div class="sm mut">${esc(p.type)}${p.rate !== '' ? ` · ${p.rate}%` : ''}${p.close ? ` · до ${fmtDate(p.close)}` : ''}${po ? ` · к выплате ≈ ${money(po.total, p.cur)}` : ''}</div></div>
    ${over ? '<span class="tag warn">выше лимита</span>' : ''}
    ${n != null && n <= 30 && !p.archived ? `<span class="tag ${n <= 7 ? 'bad' : 'warn'}">${n < 0 ? 'просрочено' : n === 0 ? 'сегодня' : n + ' дн'}</span>` : ''}
    <div class="amt">${money(a, p.cur)}${p.cur !== 'RUB' ? `<div class="sm mut">≈ ${money(a * rateOf(p.cur), 'RUB')}</div>` : ''}</div></div>`;
  }).join('');
}
function openPos(id) {
  const isNew = !id; const p = isNew ? { id: uid(), type: 'Банковский вклад', where: '', cur: 'RUB', rate: '', cond: '', open: '', close: '', reopen: '', comment: '', limit: '', history: [], archived: false } : S.data.positions.find(x => x.id === id);
  const draft = { ...p, history: p.history.map(h => ({ ...h })) }, po = isNew ? null : payoutOf(p);
  const html = `<div class="row" style="margin-bottom:12px"><h3 class="grow">${isNew ? 'Новая позиция' : 'Позиция'}</h3><button class="ic" data-x="close">${ic('x')}</button></div>
  <form id="pf" class="col" autocomplete="off">
    <div class="grid g2" style="gap:10px"><label class="f">Тип<input class="inp" name="type" list="tl" value="${esc(draft.type)}"><datalist id="tl">${TYPES.map(t => `<option value="${esc(t)}">`).join('')}</datalist></label>
    <label class="f">Где лежит<input class="inp" name="where" value="${esc(draft.where)}" required></label></div>
    <div class="grid g3" style="gap:10px"><label class="f">Валюта<select class="inp" name="cur">${['RUB', 'KZT', 'USD'].map(c => `<option ${draft.cur === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
    <label class="f">Текущая сумма<input class="inp" name="amt" inputmode="decimal" value="${draft.history.length ? lastAmt(draft) : ''}"></label>
    <label class="f">Ставка, %<input class="inp" name="rate" inputmode="decimal" value="${draft.rate}"></label></div>
    <div class="grid g2" style="gap:10px"><label class="f">Лимит суммы по этой ставке<input class="inp" name="limit" inputmode="decimal" value="${draft.limit}" placeholder="например 1000000"></label>
    <div class="sm mut" style="align-self:end;padding-bottom:10px">${po ? `К выплате к ${fmtDate(p.close)} ≈ <b class="money">${fmt(po.total, p.cur)}</b> (+${fmt(po.gain, p.cur)}), простые проценты` : 'Ожидаемая выплата считается, если указаны ставка и дата «забрать до»'}</div></div>
    <label class="f">Условия<textarea class="inp" name="cond">${esc(draft.cond)}</textarea></label>
    <div class="grid g3" style="gap:10px"><label class="f">Открыто<input class="inp" type="date" name="open" value="${draft.open}"></label>
    <label class="f">Забрать до<input class="inp" type="date" name="close" value="${draft.close}"></label>
    <label class="f">Снова можно с<input class="inp" type="date" name="reopen" value="${draft.reopen}"></label></div>
    <label class="f">Комментарий<textarea class="inp" name="comment">${esc(draft.comment)}</textarea></label>
    <div><div class="row" style="margin-bottom:4px"><b class="grow sm">История сумм</b></div><div id="hl"></div>
    <div class="row" style="margin-top:8px"><input class="inp" type="date" id="hd" value="${todayISO()}"><input class="inp" id="ha" inputmode="decimal" placeholder="сумма"><button type="button" class="btn sm" data-x="addh">${ic('plus')}</button></div></div>
    <div class="row wrap" style="margin-top:6px;justify-content:space-between"><div class="row wrap">${isNew ? '' : (draft.archived ? `<button type="button" class="btn sm" data-x="restore">Вернуть из архива</button>${holdBtn('удалить навсегда', 'del', 'bad sm', 1300)}` : holdBtn('в архив', 'arch', 'sm', 800))}</div>
    <button class="btn pri" type="submit">Сохранить</button></div></form>`;
  modal(html, ov => {
    const hl = $('#hl', ov);
    const drawH = () => { const hs = [...draft.history].sort((a, b) => a.d < b.d ? 1 : -1); hl.innerHTML = hs.length ? hs.slice(0, 40).map(h => `<div class="hist"><span class="grow">${fmtDate(h.d)}</span><b class="money">${fmt(h.amt, draft.cur)}</b><button type="button" class="ic" data-x="dh" data-d="${h.d}">${ic('x')}</button></div>`).join('') : '<div class="mut sm">Записей нет</div>'; };
    drawH();
    ov.addEventListener('click', async e => {
      const b = e.target.closest('[data-x]'); if (!b) return; const x = b.dataset.x;
      if (x === 'close') closeModal();
      else if (x === 'dh') { draft.history = draft.history.filter(h => h.d !== b.dataset.d); drawH(); }
      else if (x === 'addh') { const d = $('#hd', ov).value, a = num($('#ha', ov).value); if (!d || a == null) return; draft.history = draft.history.filter(h => h.d !== d); draft.history.push({ d, amt: a }); $('#ha', ov).value = ''; drawH(); }
      else if (x === 'restore') { const q = S.data.positions.find(z => z.id === p.id); q.archived = false; await persist(); closeModal(); render(); }
    });
    ov.addEventListener('holddone', async e => {
      const act = e.detail.act, q = S.data.positions.find(z => z.id === p.id); if (!q) return; const snap = JSON.stringify(q);
      if (act === 'arch') { q.history = q.history.filter(h => h.d !== todayISO()); q.history.push({ d: todayISO(), amt: 0 }); q.archived = true; await persist(); closeModal(); render(); undoToast('Позиция в архиве', async () => { const i = S.data.positions.findIndex(z => z.id === p.id); S.data.positions[i] = JSON.parse(snap); await persist(); render(); }); }
      else if (act === 'del') { S.data.positions = S.data.positions.filter(z => z.id !== p.id); await persist(); closeModal(); render(); undoToast('Позиция удалена', async () => { S.data.positions.push(JSON.parse(snap)); await persist(); render(); }); }
    });
    $('#pf', ov).addEventListener('submit', async e => {
      e.preventDefault(); const f = new FormData(e.target);
      Object.assign(draft, { type: f.get('type').trim() || 'Прочее', where: f.get('where').trim(), cur: f.get('cur'), cond: f.get('cond'), open: f.get('open'), close: f.get('close'), reopen: f.get('reopen'), comment: f.get('comment'), rate: f.get('rate') === '' ? '' : (num(f.get('rate')) ?? ''), limit: f.get('limit') === '' ? '' : (num(f.get('limit')) ?? '') });
      const a = f.get('amt') === '' ? null : num(f.get('amt')); if (a != null && a !== lastAmt(draft)) { draft.history = draft.history.filter(h => h.d !== todayISO()); draft.history.push({ d: todayISO(), amt: a }); }
      draft.history.sort((x, y) => x.d < y.d ? -1 : 1);
      if (isNew) S.data.positions.push(draft); else Object.assign(S.data.positions.find(z => z.id === p.id), draft);
      await persist(); closeModal(); render();
    });
  });
}

/* ===== Даты ===== */
function evItem(e) {
  const p = e.p, cls = e.k === 'reopen' ? (e.n <= 0 ? 'ok' : '') : (e.n < 0 || e.n <= 7 ? 'bad' : e.n <= 30 ? 'warn' : '');
  const lab = e.k === 'close' ? (e.n < 0 ? 'Срок вышел — забрать / продлить' : 'Забрать / срок окончания') : (e.n <= 0 ? 'Уже можно открыть снова' : 'Снова можно открыть');
  return `<div class="item" data-a="editPos" data-id="${p.id}"><div class="days ${cls === 'ok' ? '' : cls}" ${cls === 'ok' ? 'style="color:var(--ok)"' : ''}><b>${e.n === 0 ? '0' : Math.abs(e.n)}</b>${e.n < 0 ? 'назад' : e.n === 0 ? 'сегодня' : 'дн'}</div>
  <div class="grow" style="min-width:0"><div class="t">${esc(p.where)}</div><div class="sm mut">${lab} · ${fmtDate(e.d)}</div>${p.cond ? `<div class="sm mut" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.cond)}</div>` : ''}</div>
  <div class="amt">${money(lastAmt(p), p.cur)}</div></div>`;
}
function moveCard() {
  const T = todayISO(), free = {};
  for (const p of act()) if (p.close && p.close <= addDays(T, 30)) { const po = payoutOf(p); free[p.cur] = (free[p.cur] || 0) + (po ? po.total : lastAmt(p)); }
  const cs = Object.keys(free).filter(c => free[c] > 0); if (!cs.length) return '';
  return `<div class="card" style="margin-bottom:14px"><div class="row"><h3 class="grow">Куда переложить освобождающиеся деньги</h3><button class="btn sm" data-a="offers">Ставки банков</button></div>` + cs.map(c => {
    const amt = free[c], os = S.data.settings.offers.filter(o => o.cur === c && o.rate).sort((x, y) => y.rate - x.rate).slice(0, 3);
    return `<div style="margin-top:12px"><div class="sm mut" style="margin-bottom:6px">В ближайшие 30 дней освободится ≈ ${money(amt, c)}</div>${os.length ? os.map(o => {
      const lim = o.max && o.max < amt, eff = Math.min(amt, o.max || amt) * o.rate / 100;
      return `<div class="item" style="cursor:default"><div class="dot" style="background:var(--acc)">%</div><div class="grow"><div class="t">${esc(o.bank || '—')} · ${o.rate}%</div><div class="sm mut">${o.term ? o.term + ' мес · ' : ''}${lim ? `лимит ${fmt(o.max, c)} — войдёт часть` : 'войдёт вся сумма'}</div></div><div class="amt sm">≈ +${money(eff, c)}<div class="mut">в год</div></div></div>`;
    }).join('') : '<div class="sm mut">Нет ставок в этой валюте — добавь в справочнике.</div>'}</div>`;
  }).join('') + '</div>';
}
function viewDates() {
  const ev = events(), mv = moveCard(); if (!ev.length) return mv + '<div class="card empty">Дат пока нет. Укажи «Забрать до» или «Снова можно с» в карточке позиции.</div>';
  const groups = [['Просрочено', e => e.n < 0 && e.k === 'close'], ['Ближайшие 7 дней', e => e.n >= 0 && e.n <= 7], ['До 30 дней', e => e.n > 7 && e.n <= 30], ['Позже', e => e.n > 30], ['Уже можно (недавно)', e => e.n < 0 && e.k === 'reopen']];
  return mv + groups.map(([t, f]) => { const L = ev.filter(f); return L.length ? `<div class="sect"><h2>${t}</h2><span class="mut sm">${L.length}</span></div>${L.map(evItem).join('')}` : ''; }).join('');
}

    <div class="sm mut">В репозиторий уходит только зашифрованный файл — без твоего пароля это случайные байты. Токен хранится внутри шифрованных данных.</div></div>

    <button class="btn" data-a="xlsx">${ic('xls')}Импорт из Excel (.xlsx)</button>

  <div class="card col" style="grid-column:1/-1"><h3>Как это защищено</h3><div class="sm mut">Мастер-пароль → PBKDF2‑SHA256, ${Vault.ITER_PW.toLocaleString('ru-RU')} итераций → ключ, которым открывается случайный ключ данных. Данные шифруются AES‑256‑GCM (с проверкой целостности). Пароль не хранится. В браузере лежит только шифротекст. Лимит попыток и задержка защищают от случайного подбора на устройстве, а от кражи файла защищает сила пароля.</div></div></div>`;
}
function openChangePw(forced) {
  modal(`<h3>${forced ? 'Задай новый мастер-пароль' : 'Смена пароля'}</h3><p class="sm mut">${forced ? 'Ты вошёл по ключу восстановления — старый пароль утерян, поставь новый.' : 'Ключ восстановления остаётся прежним.'}</p><form id="cf" class="col"><input class="inp" id="n1" type="password" placeholder="Новый пароль" autocomplete="new-password"><div class="meter" id="mt">${meterHTML(0)}</div><input class="inp" id="n2" type="password" placeholder="Повтори" autocomplete="new-password"><div class="err" id="er"></div><div class="row" style="justify-content:flex-end">${forced ? '' : '<button type="button" class="btn" data-x="c">Отмена</button>'}<button class="btn pri">Сохранить</button></div></form>`, ov => {
    $('#n1', ov).addEventListener('input', e => $('#mt', ov).innerHTML = meterHTML(e.target.value ? Vault.strength(e.target.value).score : 0));
    ov.addEventListener('click', e => { if (e.target.closest('[data-x=c]')) closeModal(); });
    if (forced) ov.dataset.sticky = 1;
    $('#cf', ov).addEventListener('submit', async e => {
      e.preventDefault(); const a = $('#n1', ov).value, b = $('#n2', ov).value, er = $('#er', ov);
      if (a.length < 10 || Vault.strength(a).score < 2) return er.textContent = 'Минимум 10 символов и не слишком простой';
      if (a !== b) return er.textContent = 'Не совпадают';
      const blob = await S.session.setPassword(a); LS.set('sv_vault', JSON.stringify(blob)); closeModal(); toast('Пароль изменён');
    });
  });
}

/* ===== действия ===== */
async function actions(a, el) {
  const id = el.dataset.id;
  if (await anAction(a, el)) return;
  switch (a) {
    case 'tab': S.tab = id; S.q = ''; S.filter = 'Все'; S.fresh = true; render(); scrollTo(0, 0); break;
    case 'syncon': { const repo = $('#sr').value.trim().replace(/^https?:\/\/github\.com\//, ''), token = $('#st').value.trim(), er = $('#ser'); if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) return er.textContent = 'Нужны репозиторий вида имя/репо и токен'; S.data.settings.sync = { repo, token, path: 'vault.json' }; await persist(); Sync.run(); toast('Синхронизация включена'); render(); break; }
    case 'bioon': try { const b = await Bio.enable(); LS.set('sv_vault', JSON.stringify(b)); toast('Вход по отпечатку включён'); } catch (e) { LS.del('sv_pk'); toast(e.message === 'NO_PRF' ? 'Это устройство не поддерживает такой вход' : 'Не получилось включить'); } render(); break;
    case 'biooff': LS.set('sv_vault', JSON.stringify(Bio.disable())); toast('Вход по отпечатку выключен'); render(); break;
    case 'clrpos': { const n = S.data.positions.length; if (!n) { toast('Позиций нет'); break; } if (!await ask(`Удалить все позиции (${n})? Заметки и анализ останутся. Можно будет отменить.`, 'Удалить', true)) break; const old = S.data.positions; S.data.positions = []; await persist(); render(); undoToast('Позиции удалены', async () => { S.data.positions = old; await persist(); render(); }, 12000); break; }
    case 'syncnow': Sync.run(); break;
    case 'syncoff': if (await ask('Отключить синхронизацию? Данные на устройстве останутся.', 'Отключить')) { delete S.data.settings.sync; LS.del('sv_sha'); await persist(); render(); } break;
    case 'hide': S.data.settings.hide = !S.data.settings.hide; persist(); render(); break;
    case 'lock': lock(); break;
    case 'range': S.range = id; S.rc = true; render(); break;
    case 'dmode': S.dmode = id; S.rc = true; render(); break;
    case 'fc': S.fc = !S.fc; S.rc = true; render(); break;
    case 'filter': { const sn = flipSnap(); S.filter = id; render(); flipPlay(sn); break; }
    case 'hday': S.hday = id; document.querySelectorAll('.hc.sel').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); $('#hdetail').innerHTML = heatDetail(id); break;
    case 'goal': openGoal(); break;
    case 'offers': openOffers(); break;
    case 'palette': openPalette(); break;
    case 'newPos': openPos(null); break;
    case 'editPos': openPos(id); break;
    case 'addNote': { const t = $('#nt').value.trim(); if (!t) return; S.data.notes.push({ id: uid(), d: $('#nd').value || todayISO(), text: t }); await persist(); render(); break; }
    case 'delNote': { const n0 = S.data.notes.find(n => n.id === id); if (!n0) break; S.data.notes = S.data.notes.filter(n => n.id !== id); await persist(); render(); undoToast('Заметка удалена', async () => { S.data.notes.push(n0); await persist(); render(); }); break; }
    case 'theme': document.documentElement.dataset.theme = id; LS.set('sv_theme', id); render(); break;
    case 'chpw': openChangePw(false); break;
    case 'newrec': { const r = await S.session.newRecovery(); LS.set('sv_vault', JSON.stringify(r.blob)); modal(`<h3>Новый ключ восстановления</h3><p class="sm mut">Старый ключ больше не работает. Запиши этот:</p><div class="reccode">${r.code}</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn pri" data-x="c">Сохранил</button></div>`, ov => ov.addEventListener('click', e => { if (e.target.closest('[data-x=c]')) closeModal(); })); break; }
    case 'export': { const b = new Blob([LS.get('sv_vault')], { type: 'application/json' }); const u = URL.createObjectURL(b), l = document.createElement('a'); l.href = u; l.download = `nakopleniya-backup-${todayISO()}.json`; l.click(); setTimeout(() => URL.revokeObjectURL(u), 3000); toast('Копия скачана (зашифрована)'); break; }
    case 'import': pick('.json', async f => {
      try { const j = JSON.parse(await f.text()); if (!(j.v === 1 && j.wp && j.wr && j.ct)) throw 0; if (!await ask('Заменить текущее хранилище копией из файла? Нужен будет пароль от копии.', 'Заменить', true)) return; LS.set('sv_vault', JSON.stringify(j)); lock(); } catch (e) { toast('Это не файл копии хранилища'); }
    }); break;
    case 'demo': { const d = makeDemo(); S.data.positions.push(...d.positions); S.data.notes.push(...d.notes); await persist(); render(); toast('Демо добавлено'); break; }
    case 'xlsx': pick('.xlsx,.xlsm,.xls', f => doXlsx(f)); break;
  }
}
function pick(accept, cb) { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.onchange = () => i.files[0] && cb(i.files[0]); i.click(); }
function openGoal() {
  const g = S.data.settings.goal || { name: 'Цель на конец года', amount: '', date: todayISO().slice(0, 4) + '-12-31' };
  modal(`<div class="row" style="margin-bottom:10px"><h3 class="grow">Цель накопления</h3><button class="ic" data-x="c">${ic('x')}</button></div><form id="gf" class="col"><label class="f">Название<input class="inp" name="name" value="${esc(g.name)}"></label>
  <div class="grid g2" style="gap:10px"><label class="f">Сумма, ₽<input class="inp" name="amount" inputmode="decimal" value="${g.amount}" required></label><label class="f">К дате<input class="inp" type="date" name="date" value="${g.date}" required></label></div>
  <div class="row" style="justify-content:space-between"><button type="button" class="btn sm bad" data-x="clr">Убрать цель</button><button class="btn pri">Сохранить</button></div></form>`, ov => {
    ov.addEventListener('click', async e => { const b = e.target.closest('[data-x]'); if (!b) return; if (b.dataset.x === 'c') closeModal(); if (b.dataset.x === 'clr') { S.data.settings.goal = null; await persist(); closeModal(); render(); } });
    $('#gf', ov).addEventListener('submit', async e => { e.preventDefault(); const f = new FormData(e.target), v = num(f.get('amount')); if (!(v > 0)) return; S.data.settings.goal = { name: f.get('name').trim(), amount: v, date: f.get('date') }; await persist(); closeModal(); S.rc = true; render(); });
  });
}
function openOffers() {
  const O = () => S.data.settings.offers;
  const row = o => `<div class="orow" data-oid="${o.id}"><input class="inp" data-of="bank" value="${esc(o.bank)}" placeholder="Банк"><select class="inp" data-of="cur">${['RUB', 'KZT', 'USD'].map(c => `<option ${o.cur === c ? 'selected' : ''}>${c}</option>`).join('')}</select><input class="inp" data-of="rate" inputmode="decimal" value="${o.rate}" placeholder="% год."><input class="inp" data-of="max" inputmode="decimal" value="${o.max}" placeholder="макс. сумма"><input class="inp" data-of="term" inputmode="decimal" value="${o.term}" placeholder="срок, мес"><button class="ic" data-x="od" data-id="${o.id}">${ic('x')}</button></div>`;
  modal(`<div class="row" style="margin-bottom:6px"><h3 class="grow">Ставки банков</h3><button class="ic" data-x="c">${ic('x')}</button></div><p class="sm mut">Справочник для подсказки «куда переложить». Обновляй, когда ставки меняются — правки сохраняются сразу.</p><div id="ol" class="col" style="gap:8px"></div><div style="margin-top:10px"><button class="btn sm" data-x="oa">${ic('plus')}Добавить</button></div>`, ov => {
    const ol = $('#ol', ov), paint = () => { ol.innerHTML = O().length ? O().map(row).join('') : '<div class="empty">Пусто</div>'; }; paint();
    ov.addEventListener('change', e => { const r = e.target.closest('[data-oid]'); if (!r) return; const o = O().find(x => x.id === r.dataset.oid), f = e.target.dataset.of, v = e.target.value; if (!o) return; o[f] = (f === 'rate' || f === 'max' || f === 'term') ? (num(v) ?? '') : v; persist(); });
    ov.addEventListener('click', async e => {
      const b = e.target.closest('[data-x]'); if (!b) return; const x = b.dataset.x;
      if (x === 'c') { closeModal(); render(); }
      else if (x === 'oa') { O().push({ id: uid(), bank: '', cur: 'RUB', rate: '', max: '', term: '', note: '' }); await persist(); paint(); }
      else if (x === 'od') { const o = O().find(z => z.id === b.dataset.id); S.data.settings.offers = O().filter(z => z.id !== b.dataset.id); await persist(); paint(); undoToast('Ставка удалена', async () => { O().push(o); await persist(); paint(); }); }
    });
  });
}
async function doXlsx(f) {
  modal('<h3>Читаю файл…</h3><div class="skl" style="height:14px;margin:14px 0"></div><div class="skl" style="height:14px;width:72%;margin-bottom:10px"></div><div class="skl" style="height:14px;width:48%"></div>', null, 'ovl');
  await new Promise(r => setTimeout(r, 80));
  let found; try { found = parseWorkbook(await f.arrayBuffer()); } catch (e) { closeModal('ovl', true); return toast('Не смог прочитать файл: ' + e.message); }
  closeModal('ovl', true);
  if (!found.length) return toast('Не нашёл знакомых листов («движение средств», «состояние средств», «Мысли»)');
  modal(`<div class="row" style="margin-bottom:8px"><h3 class="grow">Импорт из Excel</h3><button class="ic" data-x="c">${ic('x')}</button></div><p class="sm mut">Найдено в файле. Отметь, что добавить (всё добавляется к существующему):</p>
  ${found.map((x, i) => `<label class="card row" style="align-items:flex-start;margin-bottom:8px"><input type="checkbox" data-k="${i}" ${x.positions ? 'data-pos="1"' : ''} ${x.def && x.count ? 'checked' : ''} ${x.count ? '' : 'disabled'}><div><b>${esc(x.title)}</b> <span class="tag">${x.count}</span><div class="sm mut">${esc(x.desc)}</div></div></label>`).join('')}
  <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn pri" data-x="go">Импортировать</button></div>`, ov => {
    ov.addEventListener('change', e => { const c = e.target.closest('[data-pos]'); if (c && c.checked) ov.querySelectorAll('[data-pos]').forEach(o => { if (o !== c && o.checked) { o.checked = false; toast('Позиции берутся из одного листа, иначе деньги задвоятся'); } }); });
    ov.addEventListener('click', async e => {
      const b = e.target.closest('[data-x]'); if (!b) return; if (b.dataset.x === 'c') return closeModal();
      if (b.dataset.x === 'go') { let np = 0, nn = 0, na = 0; ov.querySelectorAll('[data-k]:checked').forEach(c => { const x = found[+c.dataset.k]; if (x.positions) { S.data.positions.push(...x.positions); np += x.positions.length; } if (x.notes) { const have = new Set(S.data.notes.map(n => n.d + '|' + n.text)); const fresh = x.notes.filter(n => !have.has(n.d + '|' + n.text)); S.data.notes.push(...fresh); nn += fresh.length; } if (x.an) { const A_ = A(); if (x.an.crypto) A_.crypto = x.an.crypto; if (x.an.years) A_.years = x.an.years; if (x.an.banks) A_.banks = x.an.banks; for (const k of ['home', 'cmp', 'tax']) if (x.an[k]) A_[k] = x.an[k]; na++; } }); await persist(); closeModal(); render(); toast(`Добавлено: позиций ${np}, заметок ${nn}` + (na ? `, листов анализа ${na}` : '')); }
    });
  });
}

/* ===== события ===== */
document.addEventListener('click', e => {
  const m = e.target.closest('.money');
  if (m && S.data && S.data.settings.hide) { e.stopPropagation(); e.preventDefault(); m.classList.add('rv'); setTimeout(() => m.classList.remove('rv'), 3500); return; }
  const el = e.target.closest('[data-a]'); if (el && S.data) actions(el.dataset.a, el);
}, true);
document.addEventListener('input', e => {
  const i = e.target.dataset.i; if (!i || !S.data) return;
  if (i === 'q') { S.q = e.target.value; const sn = flipSnap(); $('#plist').innerHTML = plist(); flipPlay(sn); }
  else if (i === 'q2') { S.q = e.target.value; const L = S.data.notes.filter(n => n.text.toLowerCase().includes(S.q.toLowerCase())).sort((a, b) => a.d < b.d ? 1 : -1); $('#nlist').innerHTML = L.length ? L.map(n => `<div class="item" style="align-items:flex-start;cursor:default"><div class="grow"><div class="sm mut">${fmtDate(n.d)}</div><div style="white-space:pre-wrap">${esc(n.text)}</div></div><button class="ic" data-a="delNote" data-id="${n.id}">${ic('x')}</button></div>`).join('') : '<div class="empty">Заметок нет</div>'; }
  else if (i === 'rKZT' || i === 'rUSD') { const v = num(e.target.value); if (v > 0) { S.data.settings.rates[i.slice(1)] = v; persist(); } }
});
document.addEventListener('change', e => {
  if (anChange(e)) return;
  const i = e.target.dataset.i; if (!i || !S.data) return;
  if (i === 'autolock') { S.data.settings.autolock = Number(e.target.value); persist(); bumpIdle(); }
  else if (i === 'hidedef') { S.data.settings.hide = e.target.checked; persist(); render(); }
  else if (i === 'rKZT' || i === 'rUSD') render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const os = document.querySelectorAll('.ov'), o = os[os.length - 1]; if (o && !o.dataset.sticky) { if (o.id) closeModal(o.id); else o.remove(); } } });

/* ===== старт ===== */
(function boot() {
  initUI(); const th = LS.get('sv_theme'); if (th) document.documentElement.dataset.theme = th;
  if (LS.get('sv_vault')) renderUnlock(); else renderSetup();
})();

</script>
<script>if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
