plugins { id 'com.android.application' }
def runNo = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
android {
    namespace 'com.nakopleniya.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.nakopleniya.app"
        minSdk 24
        targetSdk 34
        versionCode = runNo
        versionName = "1.0." + runNo
    }
    signingConfigs { release { storeFile file("release.keystore"); storePassword "nakopleniya2026"; keyAlias "nak"; keyPassword "nakopleniya2026" } }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
